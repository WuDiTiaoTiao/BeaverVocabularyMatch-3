<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#107f86" />
    <title>词汇消消乐 · 考研英语同义词</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" id="app">
      <div class="ambient ambient-left" aria-hidden="true"></div>
      <div class="ambient ambient-right" aria-hidden="true"></div>

      <main class="game-frame">
        <header class="game-header">
          <div class="brand-lockup">
            <div class="brand-mark" aria-hidden="true">词</div>
            <div>
              <p class="eyebrow">POSTGRAD ENGLISH · SYNONYM MATCH</p>
              <h1>词汇消消乐</h1>
              <p class="subtitle">考研英语同义词配对挑战</p>
            </div>
          </div>
          <div class="header-note">
            <span class="note-dot"></span>
            <span>每局 15 个词块</span>
          </div>
        </header>

        <section class="hud" aria-label="游戏状态">
          <div class="hud-stat wave-stat">
            <span class="hud-label">当前波次</span>
            <strong id="wave">第 1 / 3 波</strong>
          </div>
          <div class="hud-stat score-stat">
            <span class="hud-label">得分</span>
            <strong id="score">0000</strong>
          </div>
          <div class="timer-card" id="timer-card">
            <div class="timer-copy">
              <span class="hud-label">剩余时间</span>
              <strong><span id="timer">30</span><small>s</small></strong>
            </div>
            <div class="timer-track" aria-hidden="true"><span id="timer-fill"></span></div>
          </div>
        </section>

        <div class="progress-row">
          <div class="progress-copy">
            <span id="progress">已配对 0 / 5</span>
            <span class="progress-tip">找到同义词，连击得分更高</span>
          </div>
          <div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div>
        </div>

        <section class="playfield" aria-labelledby="board-title">
          <div class="playfield-heading">
            <div>
              <span class="section-kicker">READY · SET · MATCH</span>
              <h2 id="board-title">选出意思相近的两个词</h2>
            </div>
            <div class="combo-chip" id="combo-chip" data-active="false">
              <span class="combo-icon" aria-hidden="true">✦</span>
              <span id="combo">连击 0</span>
            </div>
          </div>

          <div class="status-line" id="status-line" aria-live="polite">点击任意词块开始配对</div>
          <div class="tile-grid" id="game-board" role="grid" aria-label="英文词块"></div>
        </section>

        <footer class="game-footer">
          <div class="footer-actions">
            <button class="action-button action-button-primary" id="hint-button" type="button">
              <span class="button-icon" aria-hidden="true">✦</span>
              <span>提示</span>
              <span class="button-cost">-25</span>
            </button>
            <button class="action-button" id="sound-button" type="button" aria-pressed="false">
              <span class="button-icon" aria-hidden="true">♪</span>
              <span id="sound-label">音效开</span>
            </button>
            <button class="action-button" id="restart-button" type="button">
              <span class="button-icon" aria-hidden="true">↻</span>
              <span>重开</span>
            </button>
          </div>
          <p class="footer-copy">每一组词都来自考研高频语境，配对后记得读一遍。</p>
        </footer>
      </main>
    </div>

    <div class="result-backdrop" id="result-modal" hidden>
      <section class="result-modal" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <div class="result-spark" aria-hidden="true">✦</div>
        <p class="section-kicker">SESSION COMPLETE</p>
        <h2 id="result-title">这一轮，完成得很漂亮</h2>
        <p class="result-message" id="result-message">继续保持你的词感。</p>
        <div class="result-stats">
          <div><span>总得分</span><strong id="final-score">0000</strong></div>
          <div><span>正确率</span><strong id="final-accuracy">0%</strong></div>
        </div>
        <button class="modal-button" id="modal-restart" type="button">再来一局 <span aria-hidden="true">↗</span></button>
      </section>
    </div>

    <div class="toast-layer" id="toast-layer" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./ui.js"></script>
  </body>
</html>
